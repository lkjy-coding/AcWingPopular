name: Notify site to rebuild

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site repo workflow
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lkjy-coding/lkjy-coding.github.io/actions/workflows/build-files.yml/dispatches \
            -d '{"ref":"main"}'
